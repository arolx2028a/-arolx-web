<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArolX Pro - تسجيل الدخول وإنشاء الحساب</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background: #020617;
            color: #f8fafc;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        }
        .auth-title {
            margin: 0 0 6px 0;
            color: #38bdf8;
            font-size: 20px;
            font-weight: 800;
            text-align: center;
        }
        .auth-subtitle {
            margin: 0 0 20px 0;
            color: #94a3b8;
            font-size: 12px;
            text-align: center;
        }
        .tabs-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #020617;
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 18px;
            border: 1px solid #1e293b;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            padding: 10px;
            border-radius: 9px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #0284c7;
            color: #fff;
        }
        .form-box { display: none; }
        .form-box.active { display: block; }
        .form-group { margin-bottom: 14px; }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 12px;
            color: #cbd5e1;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            background: #020617;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 11px 12px;
            color: #fff;
            font-size: 13px;
            outline: none;
        }
        .form-group input:focus { border-color: #38bdf8; }
        .submit-btn {
            width: 100%;
            background: #059669;
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
        }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .status-msg {
            margin-top: 12px;
            font-size: 12px;
            min-height: 18px;
            text-align: center;
            color: #f87171;
            line-height: 1.5;
        }
        .status-msg.ok { color: #34d399; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1 class="auth-title">ArolX Pro</h1>
        <p class="auth-subtitle">سجّل دخولك أو أنشئ حساباً جديداً للانتقال إلى المنصة</p>

        <div class="tabs-row">
            <button type="button" class="tab-btn active" id="tabLoginBtn" onclick="switchAuthMode('login')">تسجيل الدخول</button>
            <button type="button" class="tab-btn" id="tabRegisterBtn" onclick="switchAuthMode('register')">حساب جديد</button>
        </div>

        <form id="loginForm" class="form-box active" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn" id="loginSubmitBtn">دخول إلى المنصة</button>
        </form>

        <form id="registerForm" class="form-box" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="regName" required placeholder="اسمك الكامل">
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="regEmail" required placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>كلمة المرور (6 أحرف أو أكثر)</label>
                <input type="password" id="regPassword" minlength="6" required placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>كود الدعوة (اختياري - مثل ARX-1000)</label>
                <input type="text" id="regReferral" placeholder="ARX-1000">
            </div>
            <button type="submit" class="submit-btn" id="regSubmitBtn">إنشاء الحساب والدخول</button>
        </form>

        <div id="authStatus" class="status-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth,
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            setPersistence,
            browserLocalPersistence
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore,
            doc,
            getDoc,
            setDoc,
            collection,
            getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyB7kCAWBjr_Pin9izKlkcTqA1GEEKGSZsA",
          authDomain: "tradingapp-93608.firebaseapp.com",
          projectId: "tradingapp-93608",
          storageBucket: "tradingapp-93608.firebasestorage.app",
          messagingSenderId: "1037136476622",
          appId: "1:1037136476622:web:573988924b408bcef6539f",
          measurementId: "G-3BSEMM7PDS"
        };

        const SESSION_STORAGE_KEY = "arolx_active_session_v1";
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function setStatus(msg, isOk = false) {
            const el = document.getElementById("authStatus");
            if (!el) return;
            el.textContent = msg;
            el.className = isOk ? "status-msg ok" : "status-msg";
        }

        function saveSession(uid, userData) {
            try {
                localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
                    uid,
                    userData,
                    savedAt: Date.now()
                }));
            } catch (_) {}
        }

        function goToDashboard() {
            window.location.replace("./index.html");
        }

        window.switchAuthMode = function(mode) {
            setStatus("");
            const isLogin = mode === "login";
            document.getElementById("tabLoginBtn").classList.toggle("active", isLogin);
            document.getElementById("tabRegisterBtn").classList.toggle("active", !isLogin);
            document.getElementById("loginForm").classList.toggle("active", isLogin);
            document.getElementById("registerForm").classList.toggle("active", !isLogin);
        };

        async function getNextUserNumber() {
            let maxNum = 1000;
            try {
                const snap = await getDocs(collection(db, "users"));
                snap.forEach((d) => {
                    const n = Number(d.data()?.userNumber || 0);
                    if (n >= maxNum) maxNum = n + 1;
                });
            } catch (_) {}
            return maxNum;
        }

        async function findReferrerByCode(rawCode) {
            const clean = String(rawCode || "").trim().toUpperCase();
            if (!clean) return { referredByName: "", referredByNumber: "", referredByCode: "" };
            const numPart = clean.replace(/^ARX-?/i, "").trim();
            try {
                const snap = await getDocs(collection(db, "users"));
                for (const d of snap.docs) {
                    const u = d.data();
                    const uNum = String(u.userNumber || "").trim();
                    if ((numPart && uNum === numPart) || `ARX-${uNum}` === clean) {
                        return {
                            referredByName: u.fullName || "متداول",
                            referredByNumber: uNum,
                            referredByCode: `ARX-${uNum}`
                        };
                    }
                }
            } catch (_) {}
            return { referredByName: "", referredByNumber: "", referredByCode: clean };
        }

        window.handleLogin = async function(event) {
            event.preventDefault();
            const btn = document.getElementById("loginSubmitBtn");
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            btn.disabled = true;
            setStatus("جاري تسجيل الدخول...", true);

            try {
                await setPersistence(auth, browserLocalPersistence);
                const cred = await signInWithEmailAndPassword(auth, email, password);
                const uid = cred.user.uid;
                const ref = doc(db, "users", uid);
                const snap = await getDoc(ref);

                const userData = snap.exists() ? snap.data() : {
                    fullName: "متداول",
                    email,
                    balance: 0,
                    futuresBalance: 0,
                    todayProfit: 0,
                    userNumber: await getNextUserNumber(),
                    lastCodeDate: new Date().toDateString(),
                    activatedCodes: [false, false, false],
                    joinedAt: new Date().toISOString()
                };

                if (!snap.exists()) {
                    await setDoc(ref, userData);
                }

                saveSession(uid, userData);
                setStatus("تم الدخول بنجاح، جاري التحويل...", true);
                goToDashboard();
            } catch (err) {
                setStatus("تعذر تسجيل الدخول: تأكد من البريد الإلكتروني وكلمة المرور.");
                btn.disabled = false;
            }
        };

        window.handleRegister = async function(event) {
            event.preventDefault();
            const btn = document.getElementById("regSubmitBtn");
            const fullName = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim();
            const password = document.getElementById("regPassword").value;
            const referralInput = document.getElementById("regReferral").value.trim();

            btn.disabled = true;
            setStatus("جاري إنشاء الحساب...", true);

            try {
                await setPersistence(auth, browserLocalPersistence);
                const cred = await createUserWithEmailAndPassword(auth, email, password);
                const uid = cred.user.uid;
                const nextNumber = await getNextUserNumber();
                const refInfo = await findReferrerByCode(referralInput);

                const userData = {
                    fullName,
                    email,
                    balance: 0,
                    futuresBalance: 0,
                    todayProfit: 0,
                    userNumber: nextNumber,
                    lastCodeDate: new Date().toDateString(),
                    activatedCodes: [false, false, false],
                    referredByName: refInfo.referredByName,
                    referredByNumber: refInfo.referredByNumber,
                    referredByCode: refInfo.referredByCode,
                    myReferrals: [],
                    joinedAt: new Date().toISOString()
                };

                await setDoc(doc(db, "users", uid), userData);
                saveSession(uid, userData);
                setStatus("تم إنشاء الحساب بنجاح، جاري التحويل...", true);
                goToDashboard();
            } catch (err) {
                const code = err?.code || "";
                if (code === "auth/email-already-in-use") {
                    setStatus("هذا البريد الإلكتروني مستخدم بالفعل.");
                } else if (code === "auth/weak-password") {
                    setStatus("كلمة المرور ضعيفة، يجب أن تكون 6 أحرف أو أكثر.");
                } else {
                    setStatus("تعذر إنشاء الحساب: " + (err?.message || "تحقق من البيانات والاتصال"));
                }
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>
